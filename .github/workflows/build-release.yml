name: Build & Release GameRoomLog

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 🧪 Executar Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências de Teste
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r frontend_desktop/requirements.txt

      - name: Executar Pytest
        run: |
          pytest -v

  build-linux:
    name: 🐧 Build Linux AppImage
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-glx libegl1-mesa libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 wget file

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r backend/requirements.txt
          pip install -r frontend_desktop/requirements.txt

      - name: Compilar Binário com PyInstaller
        run: |
          pyinstaller --clean gameroomlog.spec

      - name: Montar Estrutura AppDir e Gerar AppImage
        run: |
          mkdir -p dist/AppDir/usr/bin
          mkdir -p dist/AppDir/usr/share/icons/hicolor/256x256/apps
          cp dist/gameroomlog dist/AppDir/usr/bin/gameroomlog
          cp resources/gameroomlog.desktop dist/AppDir/gameroomlog.desktop
          
          if [ -f resources/icon.png ]; then
            cp resources/icon.png dist/AppDir/gameroomlog.png
            cp resources/icon.png dist/AppDir/usr/share/icons/hicolor/256x256/apps/gameroomlog.png
          else
            touch dist/AppDir/gameroomlog.png
          fi

          cat << 'EOF' > dist/AppDir/AppRun
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/gameroomlog" "$@"
          EOF
          chmod +x dist/AppDir/AppRun

          wget -q -O dist/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage || \
          wget -q -O dist/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x dist/appimagetool

          ARCH=x86_64 dist/appimagetool --appimage-extract-and-run dist/AppDir dist/GameRoomLog-x86_64.AppImage
          chmod +x dist/GameRoomLog-x86_64.AppImage

      - name: Salvar Artefato AppImage
        uses: actions/upload-artifact@v4
        with:
          name: GameRoomLog-Linux-AppImage
          path: dist/GameRoomLog-x86_64.AppImage

  build-windows:
    name: 🪟 Build Windows .EXE
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências Python
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r backend/requirements.txt
          pip install -r frontend_desktop/requirements.txt

      - name: Compilar Binário com PyInstaller
        run: |
          pyinstaller --clean gameroomlog.spec

      - name: Compactar em ZIP para Windows
        run: |
          powershell -Command "Compress-Archive -Path dist\gameroomlog.exe, resources -DestinationPath dist\GameRoomLog-Windows-x64.zip -Force"

      - name: Salvar Artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: GameRoomLog-Windows-ZIP
          path: dist/GameRoomLog-Windows-x64.zip

  publish-release:
    name: 🚀 Publicar no GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Artefato Linux
        uses: actions/download-artifact@v4
        with:
          name: GameRoomLog-Linux-AppImage
          path: release-files

      - name: Baixar Artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: GameRoomLog-Windows-ZIP
          path: release-files

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          draft: false
          prerelease: false
          generate_release_notes: true
