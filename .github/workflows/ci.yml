name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 🧪 Testes e cobertura
    runs-on: ubuntu-latest
    env:
      PERF_FACTOR: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Dependências do sistema (Qt headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3

      - name: Dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Pytest com cobertura mínima
        run: pytest --cov=backend/app --cov=frontend_desktop --cov-report=term-missing --cov-fail-under=70
